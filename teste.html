<!DOCTYPE html>
<html lang="en">
<head>
  <title>F-150 - Product Configurator</title>
  <meta charset="utf-8">
  <meta name="description" content="<model-viewer> template">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
  <style>
    body { font-family: 'Goldman', cursive; }
    @media (min-width: 768px) and (max-width: 1024px) {
      .flex-wrap {
        justify-content: center;
      }
    }
    @media (max-width: 767px) {
      .overlay-scroll {
        overflow-x: auto;
        white-space: nowrap;
      }
      .overlay-scroll div {
        display: inline-block;
        vertical-align: top;
      }
      .footer-buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 1rem;
      }
      .footer-buttons > div {
        flex: 0 0 auto;
      }
      .footer-buttons span {
        display: none;
      }
      .footer-buttons img, .footer-buttons div {
        width: 3rem;
        height: 3rem;
      }
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <model-viewer id="modelo2D" src="RAPTOR.glb" scale="1.0 1.0 1.0" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="5" environment-image="kloppenheim_02_4k.hdr" exposure="1.0" shadow-softness="0" tone-mapping="agx" skybox-image="rosendal_plains_2_2k.hdr" skybox-height="1.5m" max-camera-orbit="auto 90deg auto">
  </model-viewer>
  <footer id="conteudo" class="overlay-scroll">
    <div class="footer-buttons flex flex-col justify-center p-4 bg-white shadow-md fixed inset-x-0 bottom-0 mx-auto w-full h-auto transition-all duration-300 ease-in-out hover:shadow-lg">
      <div class="flex gap-4 flex-nowrap justify-center">
        <div id="botaoRotacao" class="flex flex-col items-center cursor-pointer">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/80c2b38cc143c5cbc7d2569c6cb98b41c3ba8f1164e9c239e8eeec620f658405?apiKey=c135008d38164259a21934cb5ef98321&" class="shrink-0 aspect-square w-12 h-12">
          <span class="text-sm">Rotate</span>
        </div>
        <div id="ativarSkybox" class="flex flex-col items-center cursor-pointer">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/e6b22d2f6b728ada56b50339cf0f009f10ff2c4206bc244eb6929e00eb6a1da3?apiKey=c135008d38164259a21934cb5ef98321&" class="shrink-0 aspect-square w-12 h-12">
          <span class="text-sm">Skybox</span>
        </div>
        <div id="varianteDefault" class="flex flex-col items-center cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-yellow-400 h-10 w-10"></div>
          <span class="text-sm">Yellow</span>
        </div>
        <div id="varianteOrange" class="flex flex-col items-center cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-orange-400 h-10 w-10"></div>
          <span class="text-sm">Orange</span>
        </div>
        <div id="varianteRed" class="flex flex-col items-center cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-red-500 h-10 w-10"></div>
          <span class="text-sm">Red</span>
        </div>
        <div id="varianteBlue" class="flex flex-col items-center cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-blue-500 h-10 w-10"></div>
          <span class="text-sm">Blue</span>
        </div>
        <div id="btnOpenFrontDoor" class="flex flex-col items-center cursor-pointer">
          <img src="porta-do-carro.png" class="shrink-0 aspect-square w-12 h-12">
          <span class="text-sm">Front Door</span>
        </div>
        <div id="btnOpenBackDoor" class="flex flex-col items-center cursor-pointer">
          <img src="carro.png" class="shrink-0 aspect-square w-12 h-12">
          <span class="text-sm">Hood</span>
        </div>
      </div>
    </div>
  </footer>
  <effect-composer id="customComposer" render-mode="quality">
    <smaa-effect quality="high" blend-mode="DEFAULT" opacity="1"></smaa-effect>
    <color-grade-effect brightness="0.2" contrast="0.2" saturation="0.2" smoothing="0.3" tonemapping="reinhard2_adaptive" blend-mode="DEFAULT" opacity="1" hue="0"></color-grade-effect>
  </effect-composer>
  <script src="rotacao.js"></script>
  <script src="script.js"></script>
  <script src="img.js"></script>
  <script src="/modelo_moto/telacar.js"></script>
  <script src="carvariantes.js"></script>
  <script src="hostpost.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const varianteBlue = document.getElementById('varianteBlue');
      varianteBlue.addEventListener('click', function() {
        this.classList.toggle('selecionado');
      });

      const botaoRotacao = document.getElementById('botaoRotacao');
      botaoRotacao.addEventListener('click', function() {
        this.classList.toggle('ativo');
      });

      const ativarSkybox = document.getElementById('ativarSkybox');
      ativarSkybox.addEventListener('click', function() {
        const modelViewer = document.getElementById('modelo2D');
        if (this.classList.contains('day')) {
          modelViewer.environmentImage = 'kloppenheim_02_4k.hdr.hdr';
          this.classList.remove('day');
          this.classList.add('night');
        } else {
          modelViewer.environmentImage = 'rainforest_trail_4k.hdr';
          this.classList.remove('night');
          this.classList.add('day');
        }
      });
    });
  </script>
  <script>
    const variantes = {
      varianteDefault: 'Default',
      varianteOrange: 'BLUE',
      varianteRed: 'ORANGE',
      varianteBlue: 'RED',
    };

    const modelViewerVariants = document.querySelector("model-viewer#modelo2D");

    Object.keys(variantes).forEach(id => {
      document.getElementById(id).addEventListener('click', function() {
        const varianteNome = variantes[id];
        modelViewerVariants.variantName = varianteNome;
      });
    });
  </script>
  <script>
    const modelViewer = document.getElementById('modelo2D');
    const btnOpenFrontDoor = document.getElementById('btnOpenFrontDoor');
    const btnOpenBackDoor = document.getElementById('btnOpenBackDoor');
    let frontDoorOpen = false;
    let backDoorOpen = false;

    btnOpenFrontDoor.addEventListener('click', () => {
      frontDoorOpen = !frontDoorOpen;
      if (frontDoorOpen) {
        modelViewer.animationName = 'Object_126Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000);
        btnOpenFrontDoor.querySelector('img').src = 'porta-do-carro-aberta.png';
      } else {
        modelViewer.currentTime = 0;
        modelViewer.animationName = 'Object_126Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000);
        btnOpenFrontDoor.querySelector('img').src = 'porta-do-carro.png';
      }
    });

    btnOpenBackDoor.addEventListener('click', () => {
      backDoorOpen = !backDoorOpen;
      if (backDoorOpen) {
        modelViewer.animationName = 'Object_93Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000);
        btnOpenBackDoor.querySelector('img').src = 'carro-aberto.png';
      } else {
        modelViewer.currentTime = 0;
        modelViewer.animationName = 'Object_93Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000);
        btnOpenBackDoor.querySelector('img').src = 'carro.png';
      }
    });
  </script>
  <style>
    .ativo {
      animation: rotate-animation 0.5s ease-in-out;
      transform: rotate(360deg);
    }
    @keyframes rotate-animation {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .day img {
      filter: brightness(100%);
    }
    .night img {
      filter: brightness(50%);
    }
  </style>
</body>
</html>
