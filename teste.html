  <style>
    body { font-family: 'Goldman', cursive;
            height: 100vh;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
    }
    @media (min-width: 768px) and (max-width: 1024px) {
      /* Estilos específicos para modo tablet */
      .flex-wrap {
        justify-content: center;
      }
    }
    @media (max-width: 767px) {
      /* Estilos específicos para modo mobile */
      .overlay-scroll {
        overflow-x: auto;
        white-space: nowrap;
        justify-content: center;
      }
      .overlay-scroll div {
        display: inline-block;
        vertical-align: top;
      }
      .footer-buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 1rem;
      }
      .footer-buttons > div {
        flex: 0 0 auto;
        background-color: #0000;
      }
      .footer-buttons span {
        display: none;
      }
      .footer-buttons img, .footer-buttons div {
        width: 2.75rem;
        height: 2.75rem;
      }
    }

    /* Estilos para o menu off-canvas */
    .off-canvas-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(14, 13, 13, 0);
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
    }

    .off-canvas-menu.open {
      transform: translateY(0);
      bottom: 4rem;
    }

    .menu-toggle {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0000007a;
      color: #bdbdbd;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
    }

    #varianteBlue div {
  background: linear-gradient(145deg, #1e3a8a, #3b82f6, #89c9ff);
  box-shadow: 4px 4px 8px #1e40af, -4px -4px 8px #3b82f6;
  transition: transform 0.2s, box-shadow 0.2s;
}

#varianteBlue div:hover {
  transform: translateY(-2px);
  box-shadow: 6px 6px 12px #1e40af, -6px -6px 12px #3b82f6;
}

#varianteBlue span {

<body style="display: center; height: 100vh; width: 100%; align-items: center;">

  <effect-composer id="customComposer" render-mode="performance">
    <smaa-effect quality="high" blend-mode="DEFAULT" opacity="1"></smaa-effect>
    <color-grade-effect brightness="0.0" contrast="0.2" saturation="0.2" smoothing="0.3" tonemapping="optimized_cineon" blend-mode="DEFAULT" opacity="1" hue="0.0, 2 * PI"></color-grade-effect>
    <selective-bloom-effect strength="0.0" radius="0.8" threshold="1.0" smoothing="0.025"></selective-bloom-effect>
    <ssao-effect></ssao-effect>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const modelo2D = document.getElementById('modelo2D');
      const ativarSkybox = document.getElementById('ativarSkybox');
      const abrirAR = document.getElementById('abrirAR');
      const menuToggle = document.getElementById('menuToggle');
      const offCanvasMenu = document.querySelector('.off-canvas-menu');

      ativarSkybox.addEventListener('click', function() {
        const caminhoImagemHDRPrincipal = 'rosendal_plains_2_2k.hdr';
        const caminhoImagemHDRSecundario = 'kloppenheim_02_4k.hdr';
        const skyboxAtivo = modelo2D.getAttribute('skybox-image');

        if (skyboxAtivo === caminhoImagemHDRSecundario) {
          modelo2D.setAttribute('skybox-image', caminhoImagemHDRPrincipal);
          modelo2D.setAttribute('environment-image', caminhoImagemHDRPrincipal);
        } else {
          modelo2D.setAttribute('skybox-image', caminhoImagemHDRSecundario);
          modelo2D.setAttribute('environment-image', caminhoImagemHDRSecundario);
        }
        modelo2D.setAttribute('skybox-height', '2.45rem');
        modelo2D.setAttribute('shadow-softness', '1');
        modelo2D.setAttribute('shadow-intensity','5');
        modelo2D.setAttribute('exposure','2');


        // Manter o CSS do body
            document.body.style.height = '100vh';
            document.body.style.width = '100%';
            document.body.style.alignItems = 'center';
            document.body.style.justifyContent = 'center';
      });

      abrirAR.addEventListener('click', function() {
        modelo2D.activateAR();
      });

      menuToggle.addEventListener('click', function() {
        offCanvasMenu.classList.toggle('open');
        menuToggle.innerHTML = offCanvasMenu.classList.contains('open') ? '&#x25BC;' : '&#x25B2;'; // Alterna entre seta para cima e para baixo
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const varianteBlue = document.getElementById('varianteBlue');

      varianteBlue.addEventListener('click', function() {
        this.classList.toggle('selecionado');
      });
    });

    const colorSwatches = document.querySelectorAll('.color-swatch');

    colorSwatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        colorSwatches.forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
      });
    });

    const variantes = {
      varianteDefault: 'Default',
      varianteOrange: 'ORANGE',
      varianteRed: 'RED',
      varianteBlue: 'BLUE',
    };

    const modelViewerVariants = document.querySelector("model-viewer#modelo2D");

    Object.keys(variantes).forEach(id => {
      document.getElementById(id).addEventListener('click', function() {
        const varianteNome = variantes[id];
        modelViewerVariants.variantName = varianteNome;
      });
    });

    const ModelViewerElement = customElements.get('model-viewer#modelo2D');
    ModelViewerElement.dracoDecoderLocation = '/modelo_car_configurator/modelo_moto/DRACOLoader.js';

    (() => {
      const modelViewerVariants = document.querySelector('#modelo2D');
      const time = performance.now();

      const animate = (now) => {
        modelViewer.shadowIntensity = oscillate(0, 2, 4000, now - time);
        requestAnimationFrame(animate);
      };

      animate();
    })();

    const selectiveComposer = document.querySelector("effect-composer#customComposer");
    const selectiveBloom = selectiveComposer.querySelector("selective-bloom-effect");

    selectiveComposer.addEventListener('updated-selection', () => {
      const selection = [];
      selectiveComposer.selection.forEach((obj) => 
        (obj.material.emissive.r > 0 
        || obj.material.emissive.g > 0 
        || obj.material.emissive.b > 0) &&
          selection.push(obj)
      );
      selectiveBloom.selection = selection;
    });

    const modelViewer = document.querySelector("#modelo2D");

    let lastX;
    let panning = false;
    let skyboxAngle = 0;
    let radiansPerPixel;

    const startPan = () => {
      const orbit = modelViewer.getCameraOrbit();
      const { radius } = orbit;
      radiansPerPixel = -1 * radius / modelViewer.getBoundingClientRect().height;
      modelViewer.interactionPrompt = 'none';
    };

    const updatePan = (thisX) => {      
      const delta = (thisX - lastX) * radiansPerPixel;
      lastX = thisX;
      skyboxAngle += delta;
      const orbit = modelViewer.getCameraOrbit();
      orbit.theta += delta;
      modelViewer.cameraOrbit = orbit.toString();
      modelViewer.resetTurntableRotation(skyboxAngle);
      modelViewer.jumpCameraToGoal();
    }

    modelViewer.addEventListener('mousedown', (event) => {
      panning = event.button === 2 || event.ctrlKey || event.metaKey || event.shiftKey;
      if (!panning)
        return;

      lastX = event.clientX;
      startPan();
      event.stopPropagation();
    }, true);

    modelViewer.addEventListener('touchstart', (event) => {
      const {targetTouches, touches} = event;
      panning = targetTouches.length === 2 && targetTouches.length === touches.length;
      if (!panning)
        return;

      lastX = 0.5 * (targetTouches[0].clientX + targetTouches[1].clientX);
      startPan();
    }, true);

    self.addEventListener('mousemove', (event) => {
      if (!panning)
        return;

      updatePan(event.clientX);
      event.stopPropagation();
    }, true);

    modelViewer.addEventListener('touchmove', (event) => {
      if (!panning || event.targetTouches.length !== 2)
        return;

      const {targetTouches} = event;
      const thisX = 0.5 * (targetTouches[0].clientX + targetTouches[1].clientX);
      updatePan(thisX);
    }, true);

    self.addEventListener('mouseup', (event) => {
      panning = false;
    }, true);

    modelViewer.addEventListener('touchend', (event) => {
      panning = false;
    }, true);
  </script>

  <script>
    const modelViewer = document.getElementById('modelo2D');
    const btnOpenFrontDoor = document.getElementById('btnOpenFrontDoor');
    const btnOpenBackDoor = document.getElementById('btnOpenBackDoor');
    const btnOpenHood = document.getElementById('btnOpenHood');
    let hoodOpen = false;
    let frontDoorOpen = false;
    let backDoorOpen = false;
  
    btnOpenFrontDoor.addEventListener('click', () => {
      frontDoorOpen = !frontDoorOpen;
      if (frontDoorOpen) {
        modelViewer.animationName = 'Object_126Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1500); // Ajuste o tempo conforme necessário
        btnOpenFrontDoor.querySelector('img').src = 'ICONES FUNDO BRANCO-01.png'; // Troque o ícone

        modelViewer.currentTime = 0;

        modelViewer.currentTime = 0;

        btnOpenHood.querySelector('img').src = 'ICONES FUNDO BRANCO-04.png'; // Troque o ícone
