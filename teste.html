<!DOCTYPE html>
<html lang="en">
<head>
    <title>B-01 - Product Configurator</title>
    <meta charset="utf-8">
    <meta name="description" content="<model-viewer> template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com/3.2.0"></script>
    <script src="./tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects/dist/model-viewer-effects.min.js"></script>
    <link type="text/css" href="./styles.css" rel="stylesheet">
    <style>
      body { font-family: 'Goldman', cursive; }
      @media (min-width: 768px) and (max-width: 1024px) {
        .flex-wrap { justify-content: center; }
      }
      @media (max-width: 767px) {
        .overlay-scroll { overflow-x: auto; white-space: nowrap; }
        .overlay-scroll div { display: inline-block; vertical-align: top; }
        .footer-buttons { display: flex; flex-direction: row; justify-content: space-around; flex-wrap: nowrap; overflow-x: auto; padding: 1rem; }
        .footer-buttons > div { flex: 0 0 auto; }
        .footer-buttons span { display: none; }
        .footer-buttons img, .footer-buttons div { width: 3rem; height: 3rem; }
      }
    </style>
</head>
<body>
    <model-viewer id="modelo2D" src="./moto/Biketeste.gltf" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="5" environment-image="kloppenheim_02_4k.hdr" exposure="1.5" shadow-softness="0" tone-mapping="neutral" skybox-image="rosendal_plains_2_2k.hdr" skybox-height="3.5m" max-camera-orbit="auto 90deg auto" scale="1 1 1">
    </model-viewer>
    <footer id="conteudo" class="overlay-scroll">
      <div class="footer-buttons flex flex-col justify-center p-4 bg-white shadow-md fixed inset-x-0 bottom-0 mx-auto w-full h-auto transition-all duration-300 ease-in-out hover:shadow-lg">
        <div class="flex gap-4 flex-nowrap justify-center">
          <div id="botaoRotacao" class="flex flex-col items-center cursor-pointer">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/80c2b38cc143c5cbc7d2569c6cb98b41c3ba8f1164e9c239e8eeec620f658405?apiKey=c135008d38164259a21934cb5ef98321&" class="shrink-0 aspect-square w-12 h-12">
            <span class="text-sm">Rotate</span>
          </div>
          <div id="ativarSkybox" class="flex flex-col items-center cursor-pointer">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/e6b22d2f6b728ada56b50339cf0f009f10ff2c4206bc244eb6929e00eb6a1da3?apiKey=c135008d38164259a21934cb5ef98321&" class="shrink-0 aspect-square w-12 h-12">
            <span class="text-sm">Skybox</span>
          </div>
          <div id="varianteDefault" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-yellow-400 h-10 w-10"></div>
            <span class="text-sm">Yellow</span>
          </div>
          <div id="varianteOrange" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-orange-400 h-10 w-10"></div>
            <span class="text-sm">Orange</span>
          </div>
          <div id="varianteRed" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-red-500 h-10 w-10"></div>
            <span class="text-sm">Red</span>
          </div>
          <div id="varianteBlue" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-blue-500 h-10 w-10"></div>
            <span class="text-sm">Blue</span>
          </div>
          <div id="ativarAR" class="flex flex-col items-center cursor-pointer">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/ar_icon.png" class="shrink-0 aspect-square w-12 h-12">
            <span class="text-sm">AR</span>
          </div>
        </div>
      </div>
    </footer>
    <effect-composer id="customComposer" render-mode="quality">
      <selective-bloom-effect strength="5" radius="0.7" threshold="0" blend-mode="DEFAULT" opacity="1" smoothing="0.025">
      <smaa-effect quality="high" blend-mode="DEFAULT" opacity="1"></smaa-effect>
      <color-grade-effect brightness="0.2" contrast="0.2" saturation="0.2" smoothing="0.3" tonemapping="reinhard2_adaptive" blend-mode="DEFAULT" opacity="1" hue="0"></color-grade-effect>
    </selective-bloom-effect></effect-composer>
    <script src="rotacao.js"></script>
    <script src="script.js"></script>
    <script src="img.js"></script>
    <script src="/modelo_moto/telacar.js"></script>
    <script src="carvariantes.js"></script>
    <script src="hostpost.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const varianteBlue = document.getElementById('varianteBlue');
  
        varianteBlue.addEventListener('click', function() {
          this.classList.toggle('selecionado');
        });
      });
    </script>
    <script>
      const colorSwatches = document.querySelectorAll('.color-swatch');
      
      colorSwatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          colorSwatches.forEach(s => s.classList.remove('selected'));
          swatch.classList.add('selected');
        });
      });
    </script>
    <script type="module">
      const variantes = {
        varianteDefault: 'Default',
        varianteOrange: 'BLUE',
        varianteRed: 'ORANGE',
        varianteBlue: 'RED',
      };
  
      const modelViewerVariants = document.querySelector("model-viewer#modelo2D");
  
      Object.keys(variantes).forEach(id => {
        document.getElementById(id).addEventListener('click', function() {
          const varianteNome = variantes[id];
          modelViewerVariants.variantName = varianteNome;
        });
      });

      document.getElementById('ativarAR').addEventListener('click', function() {
        const modelViewer = document.querySelector('model-viewer');
        modelViewer.activateAR();
      });
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@^0.163.0/build/three.module.min.js"
        }
      }
    </script>
    <script type="module">
      import * as PostProcessing from 'https://cdn.jsdelivr.net/npm/postprocessing@6.35.3/build/index.js';
      const customComposer = document.querySelector("effect-composer#customComposer");
  
      const grid = new PostProcessing.GridEffect();
      const sepia = new PostProcessing.SepiaEffect();
      const noisePass = new PostProcessing.EffectPass(undefined);
      customComposer.addPass(noisePass);
  
      customComposer.nextElementSibling.addEventListener('input', (e) => {
        grid.scale = e.target.value;
        customComposer.queueRender();
      });
    </script>
    <script>
      const ModelViewerElement = customElements.get('model-viewer');
      ModelViewerElement.dracoDecoderLocation = '/modelo_car_configurator/modelo_moto/DRACOLoader.js';
    </script>
</body>
</html>
