<!doctype html>
<html lang="en">
<head>
  <title>F-150/Product Configurator</title>
  <meta charset="utf-8">
  <meta name="description" content="<model-viewer> template">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <script src="./tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects/dist/model-viewer-effects.min.js"></script>
  <link type="text/css" href="./styles.css" rel="stylesheet">
  <style>
    body { font-family: 'Goldman', cursive; }
    @media (min-width: 768px) and (max-width: 1024px) {
      /* Estilos específicos para modo tablet */
      .flex-wrap {
        justify-content: center;
      }
    }
    @media (max-width: 767px) {
      /* Estilos específicos para modo mobile */
      .overlay-scroll {
        overflow-x: auto;
        white-space: nowrap;
      }
      .overlay-scroll div {
        display: inline-block;
        vertical-align: top;
      }
      .footer-buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 1rem;
      }
      .footer-buttons > div {
        flex: 0 0 auto;
        width: 50px;
        height: 50px;
      }
      .footer-buttons > div > img {
        width: 100%;
        height: 100%;
      }
      .footer-buttons .color-button {
        width: 50px;
        height: 50px;
        padding: 0;
        margin: 0;
      }
      .footer-buttons .color-button div {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>
<body style="display: center;">
  <model-viewer id="modelo2D" src="RAPTOR.glb" scale="0.2 0.2 0.2" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="5" environment-image="rosendal_plains_2_2k.hdr" exposure="0.8" shadow-softness="0" tone-mapping="agx" skybox-image="rosendal_plains_2_2k.hdr" skybox-height="1.5m" max-camera-orbit="auto 90deg auto">
  </model-viewer>
  <footer id="conteudo" class="overlay-scroll">
    <div class="footer-buttons flex flex-col justify-center p-4 bg-white rounded-xl shadow-md fixed inset-x-0 top-1/2 -translate-y-1/2 mx-auto w-full h-auto transition-all duration-300 ease-in-out hover:shadow-lg" style="max-width: 800px; top: 620px; background: rgba(255, 255, 255, 0.3); border-radius: 0px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); backdrop-filter: blur(15.2px); -webkit-backdrop-filter: blur(15.2px); border: 1px solid rgba(255, 255, 255, 0.13);">
      <div id="conteudo" class="flex gap-5 flex-nowrap justify-center">
        <!-- Blocos de imagens começam aqui -->
        <div id="botaoRotacao" onmouseover="mouseOver()" onmouseout="mouseOut()" class="flex flex-col items-center">
          <img loading="lazy" src="https://cdn.builder.io/api/v1/image/assets/TEMP/80c2b38cc143c5cbc7d2569c6cb98b41c3ba8f1164e9c239e8eeec620f658405?apiKey=c135008d38164259a21934cb5ef98321&amp;" class="shrink-0 aspect-square w-20 h-20">
        </div>
        <div id="ativarSkybox" class="flex flex-col items-center">
          <img loading="lazy" src="https://cdn.builder.io/api/v1/image/assets/TEMP/e6b22d2f6b728ada56b50339cf0f009f10ff2c4206bc244eb6929e00eb6a1da3?apiKey=c135008d38164259a21934cb5ef98321&amp;" class="shrink-0 aspect-square w-20 h-20">
        </div>
        <div class="flex flex-col items-center">
          <img loading="lazy" src="https://cdn.builder.io/api/v1/image/assets/TEMP/52d82820a9a955b79ef721d2c534ad7032c121b5596cae412e6e185d1232ee90?apiKey=c135008d38164259a21934cb5ef98321&amp;" class="shrink-0 aspect-square w-20 h-20">
        </div>
        <div id="btnTelaCheia" class="flex flex-col items-center">
          <img loading="lazy" src="https://cdn.builder.io/api/v1/image/assets/TEMP/00613edf22b02130aac8ff95d0086e62aa01e149c84806cd60c25f34ba51c4bb?apiKey=c135008d38164259a21934cb5ef98321&amp;" class="shrink-0 aspect-square w-20 h-20">
        </div>
        <!-- Blocos de seletores de cores começam aqui -->
        <div id="varianteDefault" class="color-button flex flex-col justify-center items-center p-2 rounded-full shadow-sm bg-white bg-opacity-30 transition-all duration-300 ease-in-out hover:shadow-lg hover:bg-opacity-100 cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-yellow-400 transition-all duration-300 ease-in-out"></div>
        </div>
        <div id="varianteOrange" class="color-button flex flex-col justify-center items-center p-2 rounded-full shadow-sm bg-white bg-opacity-30 transition-all duration-300 ease-in-out hover:shadow-lg hover:bg-opacity-100 cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-orange-400 transition-all duration-300 ease-in-out"></div>
        </div>
        <div id="varianteRed" class="color-button flex flex-col justify-center items-center p-2 rounded-full shadow-sm bg-white bg-opacity-30 transition-all duration-300 ease-in-out hover:shadow-lg hover:bg-opacity-100 cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-red-500 transition-all duration-300 ease-in-out"></div>
        </div>
        <div id="varianteBlue" class="color-button flex flex-col justify-center items-center p-2 rounded-full shadow-sm bg-white bg-opacity-30 transition-all duration-300 ease-in-out hover:shadow-lg hover:bg-opacity-100 cursor-pointer">
          <div class="shrink-0 rounded-full border-8 border-solid border-blue-500 transition-all duration-300 ease-in-out"></div>
        </div>
        <!-- Novos botões para abrir e fechar portas -->
        <div id="btnOpenFrontDoor" class="flex flex-col items-center">
          <img loading="lazy" src="front-door-icon.png" class="shrink-0 aspect-square w-20 h-20">
        </div>
        <div id="btnOpenBackDoor" class="flex flex-col items-center">
          <img loading="lazy" src="back-door-icon.png" class="shrink-0 aspect-square w-20 h-20">
        </div>
      </div>
    </div>
  </footer>

  <script>
    const modelViewer = document.getElementById('modelo2D');
    const btnOpenFrontDoor = document.getElementById('btnOpenFrontDoor');
    const btnOpenBackDoor = document.getElementById('btnOpenBackDoor');
    let frontDoorOpen = false;
    let backDoorOpen = false;

    btnOpenFrontDoor.addEventListener('click', () => {
      frontDoorOpen = !frontDoorOpen;
      if (frontDoorOpen) {
        modelViewer.animationName = 'Object_126Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000); // Ajuste o tempo conforme necessário
        btnOpenFrontDoor.querySelector('img').src = 'PORTA.png'; // Troque o ícone
      } else {
        modelViewer.currentTime = 0;
        modelViewer.animationName = 'Object_126Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000); // Ajuste o tempo conforme necessário
        btnOpenFrontDoor.querySelector('img').src = 'PORTA.png'; // Troque o ícone
      }
    });

    btnOpenBackDoor.addEventListener('click', () => {
      backDoorOpen = !backDoorOpen;
      if (backDoorOpen) {
        modelViewer.animationName = 'Object_93Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000); // Ajuste o tempo conforme necessário
        btnOpenBackDoor.querySelector('img').src = '/porta-do-carro.png'; // Troque o ícone
      } else {
        modelViewer.currentTime = 0;
        modelViewer.animationName = 'Object_93Action.001';
        modelViewer.play();
        setTimeout(() => modelViewer.pause(), 1000); // Ajuste o tempo conforme necessário
        btnOpenBackDoor.querySelector('img').src = '/porta-do-carro.png'; // Troque o ícone
      }
    });
  </script>
</body>
</html>
