    <model-viewer id="modelo2D" src="Bike.glb" ar="" ar-modes="webxr scene-viewer quick-look" camera-controls="" touch-action="pan-y" shadow-intensity="5" environment-image="kloppenheim_02_4k.hdr" exposure="1.5" shadow-softness="0" tone-mapping="neutral" skybox-image="rosendal_plains_2_2k.hdr" skybox-height="3.5m" max-camera-orbit="auto 90deg auto">
      
    </model-viewer>
    <footer id="conteudo" class="overlay-scroll">
      <div class="footer-buttons flex flex-col justify-center p-4 bg-white shadow-md fixed inset-x-0 bottom-0 mx-auto w-full h-auto transition-all duration-300 ease-in-out hover:shadow-lg">
        <div class="flex gap-4 flex-nowrap justify-center">
          <div id="botaoRotacao" class="flex flex-col items-center cursor-pointer">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/80c2b38cc143c5cbc7d2569c6cb98b41c3ba8f1164e9c239e8eeec620f658405?apiKey=c135008d38164259a21934cb5ef98321&" class="shrink-0 aspect-square w-12 h-12">
            <span class="text-sm">Rotate</span>
          </div>
          <div id="ativarSkybox" class="flex flex-col items-center cursor-pointer">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/e6b22d2f6b728ada56b50339cf0f009f10ff2c4206bc244eb6929e00eb6a1da3?apiKey=c135008d38164259a21934cb5ef98321&" class="shrink-0 aspect-square w-12 h-12">
            <span class="text-sm">Skybox</span>
          </div>
          <div id="varianteDefault" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-yellow-400 h-10 w-10"></div>
            <span class="text-sm">Yellow</span>
          </div>
          <div id="varianteOrange" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-orange-400 h-10 w-10"></div>
            <span class="text-sm">Orange</span>
          </div>
          <div id="varianteRed" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-red-500 h-10 w-10"></div>
            <span class="text-sm">Red</span>
          </div>
          <div id="varianteBlue" class="flex flex-col items-center cursor-pointer">
            <div class="shrink-0 rounded-full border-8 border-solid border-blue-500 h-10 w-10"></div>
            <span class="text-sm">Blue</span>
          </div>
        </div>
      </div>
    </footer>
    <effect-composer id="customComposer" render-mode="quality">
      <smaa-effect quality="high" blend-mode="DEFAULT" opacity="1"></smaa-effect>
      <color-grade-effect brightness="0.3" contrast="0.2" saturation="0.2" smoothing="0.3" tonemapping="optimized_cineon" blend-mode="DEFAULT" opacity="1" hue="1"></color-grade-effect>
      <selective-bloom-effect strength="0.5" radius="0.7" threshold="0"></selective-bloom-effect>
      <ssao-effect></ssao-effect>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const varianteBlue = document.getElementById('varianteBlue');
  
        varianteBlue.addEventListener('click', function() {
          // Adiciona ou remove a classe 'selecionado' ao clicar
          this.classList.toggle('selecionado');
        });
      });
    </script>
    <script>
      const colorSwatches = document.querySelectorAll('.color-swatch');
      
      colorSwatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          colorSwatches.forEach(s => s.classList.remove('selected'));
          swatch.classList.add('selected');
        });
      });
    </script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script>
      const variantes = {
        varianteDefault: 'Default',
        varianteOrange: 'BLUE',
        varianteRed: 'ORANGE',
        varianteBlue:'RED',
        // Adicione mais variantes conforme necessário
      };
  
      // Certifique-se de que o model-viewer com ID "shoe" existe no seu HTML
      const modelViewerVariants = document.querySelector("model-viewer#modelo2D");

    <script type="module">
      const modelViewer = document.querySelector("#modelo2D");
      
      let lastX;
      let panning = false;
      let skyboxAngle = 0;
      let radiansPerPixel;
          
      const startPan = () => {
        const orbit = modelViewer.getCameraOrbit();
        const { radius } = orbit;
        radiansPerPixel = -1 * radius / modelViewer.getBoundingClientRect().height;
        modelViewer.interactionPrompt = 'none';
      };
      
      const updatePan = (thisX) => {      
        const delta = (thisX - lastX) * radiansPerPixel;
        lastX = thisX;
        skyboxAngle += delta;
        const orbit = modelViewer.getCameraOrbit();
        orbit.theta += delta;
        modelViewer.cameraOrbit = orbit.toString();
        modelViewer.resetTurntableRotation(skyboxAngle);
        modelViewer.jumpCameraToGoal();
      }
      
      modelViewer.addEventListener('mousedown', (event) => {
        panning = event.button === 2 || event.ctrlKey || event.metaKey || event.shiftKey;
        if (!panning)
          return;
    
        lastX = event.clientX;
        startPan();
        event.stopPropagation();
      }, true);
    
      modelViewer.addEventListener('touchstart', (event) => {
        const {targetTouches, touches} = event;
        panning = targetTouches.length === 2 && targetTouches.length === touches.length;
        if (!panning)
          return;
    
        lastX = 0.5 * (targetTouches[0].clientX + targetTouches[1].clientX);
        startPan();
      }, true);
    
      self.addEventListener('mousemove', (event) => {
        if (!panning)
          return;
    
        updatePan(event.clientX);
        event.stopPropagation();
      }, true);
    
      modelViewer.addEventListener('touchmove', (event) => {
        if (!panning || event.targetTouches.length !== 2)
          return;
    
        const {targetTouches} = event;
        const thisX = 0.5 * (targetTouches[0].clientX + targetTouches[1].clientX);
        updatePan(thisX);
      }, true);
    
      self.addEventListener('mouseup', (event) => {
        panning = false;
      }, true);
      
      modelViewer.addEventListener('touchend', (event) => {
        panning = false;
      }, true);
    </script>
