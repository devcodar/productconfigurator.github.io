<!DOCTYPE html>
<html lang="en">
<head>
  <title>B-01 - Product Configurator</title>
  <meta charset="utf-8">
  <meta name="description" content="Product Configurator">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@google/model-viewer@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Goldman', cursive;
      height: 100vh;
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #202020, #000000);
    }
    model-viewer {
      width: 100%;
      height: 60vh;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    .control-btn {
      width: 3rem;
      height: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #333, #111);
      box-shadow: 4px 4px 6px #000, -4px -4px 6px #333;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .control-btn:hover {
      transform: scale(1.1);
      box-shadow: 6px 6px 8px #000, -6px -6px 8px #444;
    }
    .icon {
      width: 2rem;
      height: 2rem;
    }
  </style>
</head>
<body>
  <model-viewer id="model" src="Bike.glb" ar ar-modes="webxr scene-viewer quick-look" ios-src="Bike.usdz" camera-controls shadow-intensity="5" environment-image="studio_small_09_4k.hdr" exposure="1" tone-mapping="neutral">
    <button slot="ar-button" class="ar-button">View in AR</button>
  </model-viewer>
  
  <div class="controls">
    <div class="control-btn" id="rotate">
      <img class="icon" src="rotate_icon.png" alt="Rotate">
    </div>
    <div class="control-btn" id="skybox1">
      <img class="icon" src="skybox1_icon.png" alt="Skybox 1">
    </div>
    <div class="control-btn" id="skybox2">
      <img class="icon" src="skybox2_icon.png" alt="Skybox 2">
    </div>
    <div class="control-btn" id="edit">
      <img class="icon" src="edit_icon.png" alt="Edit Model">
    </div>
  </div>
  
  <script>
    document.getElementById('rotate').addEventListener('click', () => {
      alert('Rotate function!');
    });
    document.getElementById('skybox1').addEventListener('click', () => {
      document.getElementById('model').setAttribute('environment-image', 'studio_small_09_4k.hdr');
    });
    document.getElementById('skybox2').addEventListener('click', () => {
      document.getElementById('model').setAttribute('environment-image', 'venice_sunset_4k.hdr');
    });
    document.getElementById('edit').addEventListener('click', () => {
      document.getElementById('model').setAttribute('camera-controls', '');
      document.getElementById('model').setAttribute('touch-action', 'pan-y');
      alert('Edit mode activated!');
    });
  </script>
</body>
</html>
