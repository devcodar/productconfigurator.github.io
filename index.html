    <script>
        const colorSwatches = document.querySelectorAll('.color-swatch');
      
        colorSwatches.forEach(swatch => {
          swatch.addEventListener('click', () => {
            colorSwatches.forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
          });
        });
      </script>

    <script>
      const variantes = {
    varianteDefault: 'Default',
    varianteOrange: 'BLUE',
    varianteRed: 'ORANGE',
    varianteBlue:'RED',
    // Adicione mais variantes conforme necessário
};

// Certifique-se de que o model-viewer com ID "shoe" existe no seu HTML
const modelViewerVariants = document.querySelector("model-viewer#modelo2D");

Object.keys(variantes).forEach(id => {
    document.getElementById(id).addEventListener('click', function() {
        // Aqui, usamos a variável `varianteNome` para atribuir a variante correta
        const varianteNome = variantes[id];
        modelViewerVariants.variantName = varianteNome; // A linha corrigida
    });
});

      <script type="module">
        import * as PostProcessing from 'https://cdn.jsdelivr.net/npm/postprocessing@6.35.3/build/index.js';
        const customComposer = document.querySelector("effect-composer#customComposer");
      
        const grid = new PostProcessing.GridEffect();
        const sepia = new PostProcessing.SepiaEffect();
        // The camera is set automatically when added to the <effect-composer>
        const noisePass = new PostProcessing.EffectPass(undefined);
        customComposer.addPass(noisePass);
      
        customComposer.nextElementSibling.addEventListener('input', (e) => {
          grid.scale = e.target.value;
          // Request a render frame, to update
          customComposer.queueRender();
        });
      </script>
