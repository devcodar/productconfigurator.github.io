<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Configurador de Carro 3D</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Goldman', cursive;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }
    /* Menu Flutuante */
    .floating-menu {
      position: fixed;
      bottom: 1rem;
      right: 4rem;
      background-color: #141414b9;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .floating-menu img {
      width: 48px;
      height: 48px;
      margin: 0 0.5rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .floating-menu img:hover {
      transform: scale(1.1);
    }
    .submenu {
      position: absolute;
      bottom: 7rem;
      right: 4.5rem;
      background-color: #555555;
      padding: 0.5rem;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    .submenu.active {
      display: flex;
    }
    .ar-button {
      background-color: white;
      border-radius: 4px;
      border: none;
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      font-family: 'Goldman', cursive;
      cursor: pointer;
      z-index: 999;
    }
    @media (max-width: 767px) {
      .floating-menu {
        right: 50%;
        transform: translateX(50%);
      }
      .submenu {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>
<body>
  <div id="loading">Carregando ambiente 3D...</div>
  <canvas id="renderCanvas"></canvas>

  <!-- Menu Principal -->
  <div id="floatingMenu" class="floating-menu">
    <img src="color-icon.png" alt="Cores" id="btnColors">
    <img src="icon.png" alt="Comportamento" id="btnBehavior">
    <img src="set-icon.png" alt="Configurações" id="btnSet">
  </div>

  <!-- Submenus -->
  <div id="colorsMenu" class="submenu">
    <img id="varianteDefault" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-08.png" alt="Padrão" data-color="default">
    <img id="varianteBlue" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-07.png" alt="Azul" data-color="blue">
    <img id="varianteRed" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-10.png" alt="Vermelho" data-color="red">
    <img id="varianteYellow" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-11.png" alt="Amarelo" data-color="yellow">
  </div>

  <div id="behaviorMenu" class="submenu">
    <img id="btnOpenFrontDoor" src="icon-door.png" alt="Porta Dianteira" data-function="frontDoor">
    <img id="btnOpenBackDoor" src="icon-hood.png" alt="Porta Traseira" data-function="backDoor">
    <img id="btnOpenHood" src="car-trunk-icon.png" alt="Capô" data-function="hood">
  </div>

  <div id="setMenu" class="submenu">
    <img id="botaoRotacao" src="icon-rotate.png" alt="Rotação 360°" data-function="rotate">
    <img src="icon-ar.png" alt="Realidade Aumentada" data-function="ar">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const canvas = document.getElementById("renderCanvas");
      const loadingOverlay = document.getElementById("loading");
      
      // Inicializa o Babylon.js
      const engine = new BABYLON.Engine(canvas, true);
      
      // Cria a cena com HDRI 784
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.05, 1);
      
      // Carrega o HDRI 784 (ambiente profissional)
      const hdrTexture = new BABYLON.HDRCubeTexture(
        "784-hdri-skies-com.hdr", // Substitua pelo caminho correto
        scene,
        2048 // Alta resolução
      );
      scene.environmentTexture = hdrTexture;
      scene.createDefaultSkybox(hdrTexture, true, 1000);
      
      // Configuração de iluminação
      const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
      light1.intensity = 0.3;
      const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
      light2.intensity = 0.5;
      
      // Câmera
      const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 8, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 3;
      camera.upperRadiusLimit = 15;
      
      // Variáveis globais
      let carModel;
      let isRotating = false;
      let rotationInterval;
      
      // Carrega o modelo 3D
      BABYLON.SceneLoader.ImportMeshAsync(
        "",
        "",
        "RAPTOR.glb", // Substitua pelo caminho do seu modelo
        scene
      ).then(result => {
        carModel = result.meshes[0];
        carModel.scaling = new BABYLON.Vector3(0.8, 0.8, 0.8);
        
        // Ajusta a câmera
        camera.setTarget(carModel);
        const radius = carModel.getBoundingInfo().boundingSphere.radiusWorld;
        camera.radius = radius * 3;
        
        loadingOverlay.style.display = "none";
      }).catch(error => {
        console.error("Erro ao carregar o modelo:", error);
        loadingOverlay.innerHTML = "Erro ao carregar o modelo 3D. Verifique o console.";
      });
      
      // Funções de interação
      const toggleRotation = () => {
        isRotating = !isRotating;
        if (isRotating) {
          rotationInterval = setInterval(() => {
            carModel.rotation.y += 0.01;
          }, 16);
        } else {
          clearInterval(rotationInterval);
        }
      };
      
      const toggleDoor = (doorType) => {
        console.log(`${doorType === 'front' ? 'Porta dianteira' : 'Porta traseira'} ${doorAnimating ? 'fechada' : 'aberta'}`);
        // Implemente a animação da porta aqui
      };
      
      const toggleHood = () => {
        console.log(`Capô ${hoodAnimating ? 'fechado' : 'aberto'}`);
        // Implemente a animação do capô aqui
      };
      
      const changeColor = (color) => {
        console.log(`Cor alterada para: ${color}`);
        // Implemente a troca de cor aqui
      };
      
      const enterAR = async () => {
        const xr = await scene.createDefaultXRExperienceAsync({
          floorMeshes: [carModel]
        });
        xr.baseExperience.enterXRAsync("immersive-ar", "local-floor");
      };
      
      // Eventos dos botões
      document.getElementById("btnColors").addEventListener("click", () => {
        document.getElementById("colorsMenu").classList.toggle("active");
      });
      
      document.getElementById("btnBehavior").addEventListener("click", () => {
        document.getElementById("behaviorMenu").classList.toggle("active");
      });
      
      document.getElementById("btnSet").addEventListener("click", () => {
        document.getElementById("setMenu").classList.toggle("active");
      });
      
      document.getElementById("botaoRotacao").addEventListener("click", toggleRotation);
      document.querySelector('[data-function="ar"]').addEventListener("click", enterAR);
      
      // Render loop
      engine.runRenderLoop(() => {
        scene.render();
      });
      
      window.addEventListener("resize", () => {
        engine.resize();
      });
    });
  </script>
</body>
</html>
