<!DOCTYPE html>
<html lang="en">
<head>
  <title>Product Configurator</title>
  <meta charset="utf-8">
  <meta name="description" content="Product Configurator">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <script src="./tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
  <script src="https://cdn.babylonjs.com/ammo.js"></script>
  <script src="https://cdn.babylonjs.com/cannon.js"></script>
  <script src="https://cdn.babylonjs.com/Oimo.js"></script>
  <script src="https://cdn.babylonjs.com/earcut.min.js"></script>
  <script src="https://cdn.babylonjs.com/babylon.gui.min.js"></script>
  
  <style>
    body { 
      font-family: 'Goldman', cursive;
      height: 100vh;
      width: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      overflow: hidden;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Estilos para o menu flutuante */
    .floating-menu {
      position: fixed;
      bottom: 1rem;
      right: 4rem;
      background-color: #141414b9;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .floating-menu img {
      width: 48px;
      height: 48px;
      margin: 0 0.5rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .floating-menu img:hover {
      transform: scale(1.1);
    }

    .submenu {
      position: absolute;
      bottom: 7rem;
      right: 4.5rem;
      background-color: #555555;
      padding: 0.5rem;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .submenu img {
      width: 48px;
      height: 48px;
      margin: 0 0.3rem;
      cursor: pointer;
    }

    .submenu.active {
      display: flex;
    }

    /* Loading screen */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-size: 1.5rem;
    }

    /* AR button */
    .ar-button {
      background-color: #fff;
      border-radius: 4px;
      border: none;
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 12px;
      font-family: 'Goldman', cursive;
      cursor: pointer;
      z-index: 999;
    }

    @media (max-width: 767px) {
      .floating-menu {
        bottom: 1rem;
        right: 50%;
        transform: translateX(50%);
        padding: 0.5rem;
      }

      .floating-menu img {
        width: 43px;
        height: 43px;
        margin: 0.6rem 0;
      }

      .submenu {
        bottom: 7rem;
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div>Carregando modelo 3D...</div>
  </div>

  <!-- Babylon.js Canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- Menu flutuante estilizado -->
  <div id="floatingMenu" class="floating-menu">
    <img src="color-icon.png" alt="Colors" id="btnColors">
    <img src="icon.png" alt="Behavior" id="btnBehavior">
    <img src="set-icon.png" alt="Set" id="btnSet">
  </div>

  <!-- Submenus -->
  <div id="colorsMenu" class="submenu">
    <img id="varianteDefault" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-08.png" alt="Blue" data-color="blue">
    <img id="varianteBlue" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-07.png" alt="Yellow" data-color="yellow">
    <img id="varianteOrange" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-11.png" alt="Green" data-color="green">
    <img id="varianteRed" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-10.png" alt="Red" data-color="red">
  </div>

  <div id="behaviorMenu" class="submenu">
    <img id="btnOpenFrontDoor" src="icon-door.png" alt="door" data-function="rotate">
    <img id="btnOpenBackDoor" src="icon-hood.png" alt="Hood" data-function="hood">
    <img id="btnOpenHood" src="car-trunk-icon.png" alt="Trunk" data-function="trunk">
    <a href="https://devcodar.github.io/productconfigurator.github.io/"><img src="interno.png" alt="Trunk"></a>
  </div>

  <div id="setMenu" class="submenu">
    <img src="icon-skybox.png" alt="Skybox" data-function="skybox">
    <img src="icon-ar.png" alt="AR" data-function="ar">
    <img id="botaoRotacao" src="icon-rotate.png" alt="360" data-function="360">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const canvas = document.getElementById("renderCanvas");
      const loadingOverlay = document.getElementById("loading-overlay");
      
      // Inicializa o engine Babylon
      const engine = new BABYLON.Engine(canvas, true);
      
      // Cria a cena
      const createScene = function() {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.95, 0.95, 0.95, 1);
        
        // Câmera
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 5, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 2;
        camera.upperRadiusLimit = 10;
        camera.wheelDeltaPercentage = 0.01;
        
        // Luzes
        const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
        light1.intensity = 0.7;
        const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(0, -0.5, -1.0), scene);
        light2.intensity = 0.5;
        
        // Carrega o modelo
        let carModel;
        BABYLON.SceneLoader.ImportMesh("RAPTOR.glb", scene, 
          function(meshes) {
            carModel = meshes[0];
            carModel.scaling = new BABYLON.Vector3(3, 3, 3);
            loadingOverlay.style.display = "none";
            
            // Posiciona a câmera adequadamente
            camera.setTarget(carModel);
            camera.radius = carModel.getBoundingInfo().boundingBox.extendSize.length() * 3;
          },
          null,
          function(scene, message) {
            console.error("Error loading model:", message);
            loadingOverlay.innerHTML = "<div>Erro ao carregar o modelo</div>";
          }
        );
        
        return { scene, camera, carModel };
      };

      const { scene, camera, carModel } = createScene();
      
      // Menu interactions
      const btnColors = document.getElementById("btnColors");
      const btnBehavior = document.getElementById("btnBehavior");
      const btnSet = document.getElementById("btnSet");
      const colorsMenu = document.getElementById("colorsMenu");
      const behaviorMenu = document.getElementById("behaviorMenu");
      const setMenu = document.getElementById("setMenu");
      const botaoRotacao = document.getElementById("botaoRotacao");
      
      let isRotating = false;
      let rotationInterval;

      btnColors.addEventListener('click', function() {
        colorsMenu.classList.toggle('active');
        behaviorMenu.classList.remove('active');
        setMenu.classList.remove('active');
      });

      btnBehavior.addEventListener('click', function() {
        behaviorMenu.classList.toggle('active');
        colorsMenu.classList.remove('active');
        setMenu.classList.remove('active');
      });

      btnSet.addEventListener('click', function() {
        setMenu.classList.toggle('active');
        colorsMenu.classList.remove('active');
        behaviorMenu.classList.remove('active');
      });

      // Funções para os submenus
      colorsMenu.addEventListener('click', function(e) {
        const color = e.target.getAttribute('data-color');
        if (color && carModel) {
          console.log('Alterando cor para:', color);
          // Implementar mudança de cor aqui
        }
      });

      behaviorMenu.addEventListener('click', function(e) {
        const func = e.target.getAttribute('data-function');
        if (func === 'rotate') {
          console.log('Rotacionando modelo');
        } else if (func === 'hood') {
          console.log('Abrindo capô');
        } else if (func === 'trunk') {
          console.log('Abrindo porta-malas');
        }
      });

      setMenu.addEventListener('click', function(e) {
        const func = e.target.getAttribute('data-function');
        if (func === 'skybox') {
          console.log('Alterando skybox');
        } else if (func === 'ar') {
          console.log('Ativando AR');
          // Babylon WebXR
          if (scene.isXRSupported()) {
            const xr = scene.createDefaultXRExperienceAsync({
              floorMeshes: [carModel]
            });
            xr.baseExperience.enterXRAsync("immersive-ar", "local-floor");
          }
        } else if (func === '360') {
          isRotating = !isRotating;
          if (isRotating) {
            botaoRotacao.style.opacity = '1';
            rotationInterval = setInterval(() => {
              if (carModel) {
                carModel.rotation.y += 0.01;
              }
            }, 16);
          } else {
            botaoRotacao.style.opacity = '0.6';
            clearInterval(rotationInterval);
          }
        }
      });

      // Variantes do modelo
      const variantes = {
        varianteDefault: 'Default',
        varianteOrange: 'BLUE',
        varianteRed: 'ORANGE',
        varianteBlue:'RED',
      };

      Object.keys(variantes).forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.addEventListener('click', function() {
            const varianteNome = variantes[id];
            console.log('Variante selecionada:', varianteNome);
            // Implementar mudança de variante aqui
          });
        }
      });

      // Controles de animação
      const btnOpenFrontDoor = document.getElementById('btnOpenFrontDoor');
      const btnOpenBackDoor = document.getElementById('btnOpenBackDoor');
      const btnOpenHood = document.getElementById('btnOpenHood');
      let hoodOpen = false;
      let frontDoorOpen = false;
      let backDoorOpen = false;
    
      btnOpenFrontDoor.addEventListener('click', () => {
        frontDoorOpen = !frontDoorOpen;
        console.log('Porta dianteira:', frontDoorOpen ? 'Aberta' : 'Fechada');
        // Implementar animação aqui
      });
    
      btnOpenBackDoor.addEventListener('click', () => {
        backDoorOpen = !backDoorOpen;
        console.log('Porta traseira:', backDoorOpen ? 'Aberta' : 'Fechada');
        // Implementar animação aqui
      });
    
      btnOpenHood.addEventListener('click', () => {
        hoodOpen = !hoodOpen;
        console.log('Capô:', hoodOpen ? 'Aberto' : 'Fechado');
        // Implementar animação aqui
      });

      // Render loop
      engine.runRenderLoop(function() {
        scene.render();
      });

      // Resize
      window.addEventListener('resize', function() {
        engine.resize();
      });
    });
  </script>
</body>
</html>
