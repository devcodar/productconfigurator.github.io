<!DOCTYPE html>
<html lang="en">
<head>
  <title>Car Configurator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <script src="./tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <!-- Babylon.js dependencies -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <style>
    body { 
      font-family: 'Goldman', cursive;
      height: 100vh;
      width: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Your existing menu styles remain unchanged */
    .floating-menu {
      position: fixed;
      bottom: 1rem;
      right: 4rem;
      background-color: #141414b9;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
    }
    /* ... rest of your CSS ... */
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Your existing menu HTML remains unchanged -->
  <div id="floatingMenu" class="floating-menu">
    <img src="color-icon.png" alt="Colors" id="btnColors">
    <img src="icon.png" alt="Behavior" id="btnBehavior">
    <img src="set-icon.png" alt="Set" id="btnSet">
  </div>

  <div id="colorsMenu" class="submenu">
    <img id="varianteDefault" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-08.png" alt="Blue" data-color="blue">
    <img id="varianteBlue" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-07.png" alt="Yellow" data-color="yellow">
    <img id="varianteOrange" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-11.png" alt="Green" data-color="green">
    <img id="varianteRed" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-10.png" alt="Red" data-color="red">
  </div>

  <div id="behaviorMenu" class="submenu">
    <img id="btnOpenFrontDoor" src="icon-door.png" alt="door" data-function="rotate">
    <img id="btnOpenBackDoor" src="icon-hood.png" alt="Hood" data-function="hood">
    <img id="btnOpenHood" src="car-trunk-icon.png" alt="Trunk" data-function="trunk">
    <a href="https://devcodar.github.io/productconfigurator.github.io/"><img src="interno.png" alt="Trunk"></a>
  </div>

  <div id="setMenu" class="submenu">
    <img src="icon-skybox.png" alt="Skybox" data-function="skybox">
    <img src="icon-ar.png" alt="AR" data-function="ar">
    <img id="botaoRotacao" src="icon-rotate.png" alt="360" data-function="360">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);
      
      const createScene = function() {
        const scene = new BABYLON.Scene(engine);
        
        // Set up environment colors
        scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
        scene.ambientColor = new BABYLON.Color3(0.3, 0.3, 0.3);
        
        // Add fog for depth effect
        scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
        scene.fogStart = 20;
        scene.fogEnd = 60;
        scene.fogColor = new BABYLON.Color3(0.9, 0.9, 0.85);
        
        // Camera setup
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2, 5, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 2;
        camera.upperRadiusLimit = 10;
        camera.wheelDeltaPercentage = 0.01;
        
        // Lighting
        const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
        light1.intensity = 0.7;
        
        const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(0, -0.5, 1.0), scene);
        light2.intensity = 0.5;
        
        // Create ground projection skybox
        const size = 1000;
        const skydome = BABYLON.MeshBuilder.CreateBox("sky", { 
          size, 
          sideOrientation: BABYLON.Mesh.BACKSIDE 
        }, scene);
        skydome.position.y = size / 2;
        skydome.receiveShadows = true;
        
        // Create background material with ground projection
        const sky = new BABYLON.BackgroundMaterial("skyMaterial", scene);
        sky.enableGroundProjection = true;
        sky.projectedGroundRadius = 20;
        sky.projectedGroundHeight = 3;
        skydome.material = sky;
        
        // Load environment texture (using your garage_4k.env)
        sky.reflectionTexture = new BABYLON.CubeTexture("garage_4k.env", scene);
        sky.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
        
        // Load car model and position it on the ground
        let carMesh;
        BABYLON.SceneLoader.ImportMesh("", "./", "RAPTOR.glb", scene, function(meshes) {
          carMesh = meshes[0];
          carMesh.scaling = new BABYLON.Vector3(1, 1, 1);
          
          // Position car at ground level (adjust Y position based on your model)
          carMesh.position = new BABYLON.Vector3(0, 0, 0);
          
          // Group all car meshes for easier manipulation
          const carGroup = new BABYLON.TransformNode("carGroup");
          meshes.forEach(mesh => {
            mesh.parent = carGroup;
          });
          
          // Set up car animations
          setupCarAnimations(scene, carGroup);
          setupCarMaterials(scene, carGroup);
          
          // Store car group reference for later use
          scene.carGroup = carGroup;
        });
        
        // Setup menu interactions
        setupMenuInteractions(scene, camera);
        
        return scene;
      };
      
      const scene = createScene();
      
      engine.runRenderLoop(function() {
        scene.render();
      });
      
      window.addEventListener('resize', function() {
        engine.resize();
      });
      
      function setupCarAnimations(scene, carGroup) {
        // Setup your car animations here
        // Example for door opening:
        scene.animationGroups.forEach(ag => {
          if (ag.name.includes("Door")) {
            ag.stop();
          }
        });
      }
      
      function setupCarMaterials(scene, carGroup) {
        // Create materials for each color variant
        const materials = {
          blue: new BABYLON.StandardMaterial("blueMat", scene),
          yellow: new BABYLON.StandardMaterial("yellowMat", scene),
          green: new BABYLON.StandardMaterial("greenMat", scene),
          red: new BABYLON.StandardMaterial("redMat", scene)
        };
        
        // Configure materials
        materials.blue.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.8);
        materials.yellow.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.1);
        materials.green.diffuseColor = new BABYLON.Color3(0.1, 0.8, 0.1);
        materials.red.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
        
        // Store reference for later use
        scene.carMaterials = materials;
      }
      
      function setupMenuInteractions(scene, camera) {
        // Your existing menu interaction code remains the same
        const btnColors = document.getElementById('btnColors');
        const btnBehavior = document.getElementById('btnBehavior');
        const btnSet = document.getElementById('btnSet');
        const colorsMenu = document.getElementById('colorsMenu');
        const behaviorMenu = document.getElementById('behaviorMenu');
        const setMenu = document.getElementById('setMenu');
        
        // Toggle menus
        btnColors.addEventListener('click', function() {
          colorsMenu.classList.toggle('active');
          behaviorMenu.classList.remove('active');
          setMenu.classList.remove('active');
        });
        
        btnBehavior.addEventListener('click', function() {
          behaviorMenu.classList.toggle('active');
          colorsMenu.classList.remove('active');
          setMenu.classList.remove('active');
        });
        
        btnSet.addEventListener('click', function() {
          setMenu.classList.toggle('active');
          colorsMenu.classList.remove('active');
          behaviorMenu.classList.remove('active');
        });
        
        // Color selection
        colorsMenu.addEventListener('click', function(e) {
          const color = e.target.getAttribute('data-color');
          if (color && scene.carMaterials && scene.carGroup) {
            // Apply selected material to car body
            scene.carGroup.getChildMeshes().forEach(mesh => {
              if (mesh.name.includes("Body")) { // Adjust based on your model
                mesh.material = scene.carMaterials[color];
              }
            });
          }
        });
        
        // Behavior buttons
        behaviorMenu.addEventListener('click', function(e) {
          const func = e.target.getAttribute('data-function');
          if (!func) return;
          
          // Find the appropriate animation group
          let animationGroup;
          scene.animationGroups.forEach(ag => {
            if (ag.name.toLowerCase().includes(func)) {
              animationGroup = ag;
            }
          });
          
          if (animationGroup) {
            if (animationGroup.isPlaying) {
              animationGroup.stop();
            } else {
              animationGroup.play();
            }
          }
        });
        
        // Set buttons
        setMenu.addEventListener('click', function(e) {
          const func = e.target.getAttribute('data-function');
          if (!func) return;
          
          switch(func) {
            case 'skybox':
              // Toggle between different environment textures
              toggleSkybox(scene);
              break;
              
            case 'ar':
              // Enter AR mode
              enterARMode(scene, canvas);
              break;
              
            case '360':
              // Toggle auto-rotation
              toggleAutoRotation(camera);
              break;
          }
        });
        
        function toggleSkybox(scene) {
          // You can implement skybox switching logic here
          // For example, toggle between different .env files
        }
        
        async function enterARMode(scene, canvas) {
          try {
            const xr = await scene.createDefaultXRExperienceAsync({
              uiOptions: {
                sessionMode: "immersive-ar",
                referenceSpaceType: "local-floor"
              }
            });
            
            // Position car at ground level in AR
            if (scene.carGroup) {
              scene.carGroup.position = new BABYLON.Vector3(0, 0, 0);
            }
            
            // Disable camera controls in AR
            scene.activeCamera.detachControl();
          } catch (e) {
            console.error("AR not supported", e);
            alert("AR not supported on this device");
          }
        }
        
        function toggleAutoRotation(camera) {
          camera.useAutoRotationBehavior = !camera.useAutoRotationBehavior;
          const rotationButton = document.getElementById('botaoRotacao');
          if (camera.useAutoRotationBehavior) {
            rotationButton.classList.add('botao-rotacao-ativo');
            rotationButton.classList.remove('botao-rotacao');
          } else {
            rotationButton.classList.remove('botao-rotacao-ativo');
            rotationButton.classList.add('botao-rotacao');
          }
        }
      }
    });
  </script>
</body>
</html>
