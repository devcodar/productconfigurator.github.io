<!DOCTYPE html>
<html lang="en">
<head>
  <title>Car Configurator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Goldman', cursive;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }
    
    /* Seus estilos originais de menu */
    .floating-menu {
      position: fixed;
      bottom: 1rem;
      right: 4rem;
      background-color: #141414b9;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .floating-menu img {
      width: 48px;
      height: 48px;
      margin: 0 0.5rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .floating-menu img:hover {
      transform: scale(1.1);
    }

    .submenu {
      position: absolute;
      bottom: 7rem;
      right: 4.5rem;
      background-color: #555555;
      padding: 0.5rem;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .submenu img {
      width: 48px;
      height: 48px;
      margin: 0 0.3rem;
      cursor: pointer;
    }

    .submenu.active {
      display: flex;
    }

    /* AR Button Style */
    .ar-button {
      background-color: white;
      border-radius: 4px;
      border: none;
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 12px;
      font-family: 'Goldman', cursive;
      cursor: pointer;
      z-index: 999;
      color: black;
    }

    @media (max-width: 767px) {
      .floating-menu {
        bottom: 1rem;
        right: 50%;
        transform: translateX(50%);
        padding: 0.5rem;
      }
      .floating-menu img {
        width: 43px;
        height: 43px;
        margin: 0.6rem 0;
      }
      .submenu {
        bottom: 7rem;
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>
<body>
  <div id="loading">Carregando cena 3D...</div>
  <canvas id="renderCanvas"></canvas>

  <!-- Menu flutuante -->
  <div id="floatingMenu" class="floating-menu">
    <img src="color-icon.png" alt="Colors" id="btnColors">
    <img src="icon.png" alt="Behavior" id="btnBehavior">
    <img src="set-icon.png" alt="Set" id="btnSet">
  </div>

  <!-- Submenus -->
  <div id="colorsMenu" class="submenu">
    <img id="varianteDefault" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-08.png" alt="Blue" data-color="blue">
    <img id="varianteBlue" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-07.png" alt="Yellow" data-color="yellow">
    <img id="varianteOrange" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-11.png" alt="Green" data-color="green">
    <img id="varianteRed" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-10.png" alt="Red" data-color="red">
  </div>

  <div id="behaviorMenu" class="submenu">
    <img id="btnOpenFrontDoor" src="icon-door.png" alt="door" data-function="rotate">
    <img id="btnOpenBackDoor" src="icon-hood.png" alt="Hood" data-function="hood">
    <img id="btnOpenHood" src="car-trunk-icon.png" alt="Trunk" data-function="trunk">
    <a href="https://devcodar.github.io/productconfigurator.github.io/"><img src="interno.png" alt="Trunk"></a>
  </div>

  <div id="setMenu" class="submenu">
    <img src="icon-skybox.png" alt="Skybox" data-function="skybox">
    <img src="icon-ar.png" alt="AR" data-function="ar">
    <img id="botaoRotacao" src="icon-rotate.png" alt="360" data-function="360">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const canvas = document.getElementById("renderCanvas");
      const loadingOverlay = document.getElementById("loading");
      
      // Initialize engine
      const engine = new BABYLON.Engine(canvas, true);
      
      // Create scene with environment
      const createScene = async function() {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.95, 0.95, 0.95, 1);
        
        // Environment Texture - Using garage environment
        const hdrTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(
          "https://assets.babylonjs.com/environments/garageEnv.env", 
          scene
        );
        scene.environmentTexture = hdrTexture;
        scene.createDefaultSkybox(hdrTexture, true, 1000);
        
        // Camera
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 5, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 2;
        camera.upperRadiusLimit = 15;
        camera.wheelPrecision = 50;
        
        // Lights
        const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0,1,0), scene);
        light1.intensity = 0.5;
        const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(0,-0.5,-1), scene);
        light2.intensity = 0.8;
        light2.shadowEnabled = true;
        
        // Load model - UPDATE THIS PATH
        try {
          const result = await BABYLON.SceneLoader.ImportMeshAsync(
            "", 
            "", 
            "RAPTOR.glb", 
            scene
          );
          
          const carModel = result.meshes[0];
          carModel.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);
          
          // Center camera
          camera.setTarget(carModel);
          const radius = carModel.getBoundingInfo().boundingSphere.radiusWorld;
          camera.radius = radius * 3;
          
          loadingOverlay.style.display = "none";
          
          // Setup AR
          setupAR(scene, carModel);
          
          // Return both scene and car model for menu interactions
          return { scene, carModel };
        } catch (err) {
          console.error("Error loading model:", err);
          loadingOverlay.innerHTML = "Erro ao carregar modelo. Verifique o console.";
          return { scene, carModel: null };
        }
      };
      
      // AR Setup
      const setupAR = async (scene, model) => {
        try {
          const xr = await scene.createDefaultXRExperienceAsync({
            floorMeshes: [model],
            disableDefaultUI: true
          });
          
          // Create AR Button
          const arButton = document.createElement("button");
          arButton.className = "ar-button";
          arButton.textContent = "VER EM AR";
          document.body.appendChild(arButton);
          
          arButton.addEventListener("click", async () => {
            try {
              await xr.baseExperience.enterXRAsync("immersive-ar", "local-floor");
              model.scaling = new BABYLON.Vector3(1, 1, 1);
            } catch (arError) {
              console.error("AR Error:", arError);
              alert("AR não disponível: " + arError.message);
            }
          });
        } catch (xrError) {
          console.log("WebXR não suportado:", xrError);
        }
      };
      
      // Create scene and get references
      const { scene, carModel } = await createScene();
      
      // Menu Interactions - RESTORED ORIGINAL LOGIC
      const btnColors = document.getElementById("btnColors");
      const btnBehavior = document.getElementById("btnBehavior");
      const btnSet = document.getElementById("btnSet");
      const colorsMenu = document.getElementById("colorsMenu");
      const behaviorMenu = document.getElementById("behaviorMenu");
      const setMenu = document.getElementById("setMenu");
      const botaoRotacao = document.getElementById("botaoRotacao");
      
      let isRotating = false;
      let rotationInterval;
      
      // Toggle menus
      btnColors.addEventListener('click', function() {
        colorsMenu.classList.toggle('active');
        behaviorMenu.classList.remove('active');
        setMenu.classList.remove('active');
      });
      
      btnBehavior.addEventListener('click', function() {
        behaviorMenu.classList.toggle('active');
        colorsMenu.classList.remove('active');
        setMenu.classList.remove('active');
      });
      
      btnSet.addEventListener('click', function() {
        setMenu.classList.toggle('active');
        colorsMenu.classList.remove('active');
        behaviorMenu.classList.remove('active');
      });
      
      // Color variants
      const variantes = {
        varianteDefault: 'Default',
        varianteOrange: 'BLUE',
        varianteRed: 'ORANGE',
        varianteBlue:'RED',
      };
      
      Object.keys(variantes).forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.addEventListener('click', function() {
            const varianteNome = variantes[id];
            console.log('Variante selecionada:', varianteNome);
            // Implement color change here
          });
        }
      });
      
      // Behavior controls
      const btnOpenFrontDoor = document.getElementById('btnOpenFrontDoor');
      const btnOpenBackDoor = document.getElementById('btnOpenBackDoor');
      const btnOpenHood = document.getElementById('btnOpenHood');
      
      btnOpenFrontDoor.addEventListener('click', () => {
        console.log('Abrir porta dianteira');
        // Implement door animation
      });
      
      btnOpenBackDoor.addEventListener('click', () => {
        console.log('Abrir porta traseira');
        // Implement door animation
      });
      
      btnOpenHood.addEventListener('click', () => {
        console.log('Abrir capô');
        // Implement hood animation
      });
      
      // Rotation toggle
      botaoRotacao.addEventListener('click', function() {
        isRotating = !isRotating;
        if (carModel) {
          if (isRotating) {
            botaoRotacao.style.opacity = '1';
            rotationInterval = setInterval(() => {
              carModel.rotation.y += 0.01;
            }, 16);
          } else {
            botaoRotacao.style.opacity = '0.6';
            clearInterval(rotationInterval);
          }
        }
      });
      
      // Render loop
      engine.runRenderLoop(() => {
        scene.render();
      });
      
      window.addEventListener("resize", () => {
        engine.resize();
      });
    });
  </script>
</body>
</html>
