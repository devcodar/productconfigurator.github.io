<!DOCTYPE html>
<html lang="en">
<head>
  <title>Product Configurator</title>
  <meta charset="utf-8">
  <meta name="description" content="Product Configurator">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com/3.2.0"></script>
  <script src="./tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects/dist/model-viewer-effects.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@khronos/gltf-transform@0.14.2/lib/index.js"></script>
  <link type="text/css" href="./styles.css" rel="stylesheet">
  <style>
    body { 
      font-family: 'Goldman', cursive;
      height: 100vh;
      width: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: transparent;
      background-color: #f0f0f0;
    }

    /* Estilos para o menu flutuante */
    .floating-menu {
      position: fixed;
      bottom: 1rem;
      right: 4rem;
      background-color: #141414b9;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .floating-menu img {
      width: 48px;
      height: 48px;
      margin: 0 0.5rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .floating-menu img:hover {
      transform: scale(1.1);
    }

    .submenu {
      position: absolute;
      bottom: 7rem;
      right: 4.5rem;
      background-color: #555555;
      padding: 0.5rem;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .submenu img {
      width: 48px;
      height: 48px;
      margin: 0 0.3rem;
      cursor: pointer;
    }

    .submenu.active {
      display: flex;
    }

    /* Loading screen */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-size: 1.5rem;
    }

    /* AR specific styles */
    .ar-button {
      background-color: #fff;
      border-radius: 4px;
      border: none;
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 12px;
      font-family: 'Goldman', cursive;
      cursor: pointer;
      z-index: 999;
    }

    @media (max-width: 1024px) {
      /* Tablet specific styles */
      model-viewer {
        --environment-image: url(industrial_workshop_1k.hdr);
        camera-orbit: 0deg 75deg 105%;
        field-of-view: 30deg;
      }
      
      .floating-menu {
        bottom: 2rem;
        right: 2rem;
      }
      
      .submenu {
        bottom: 8rem;
        right: 2.5rem;
      }
    }

    @media (max-width: 767px) {
      /* Menu flutuante responsivo */
      .floating-menu {
        bottom: 1rem;
        right: 50%;
        transform: translateX(50%);
        padding: 0.5rem;
      }

      body{
        overflow: hidden;
      }

      .floating-menu img {
        width: 43px;
        height: 43px;
        margin: 0.6rem 0;
      }

      .submenu {
        bottom: 7rem;
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div>Carregando modelo 3D...</div>
  </div>

  <model-viewer 
    id="modelo2D" 
    src="RAPTOR.glb" 
    ar 
    ar-scale="fixed" 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y" 
    shadow-intensity="1.5" 
    environment-image="industrial_workshop_1k.hdr" 
    exposure="1.2" 
    shadow-softness="0.8" 
    tone-mapping="neutral" 
    skybox-image="industrial_workshop_1k.hdr" 
    skybox-height="2rem" 
    max-camera-orbit="auto 90deg auto" 
    min-camera-orbit="auto 15deg auto"
    max-field-of-view="45deg"
    min-field-of-view="15deg"
    scale="1 1 1" 
    ios-src="#" 
    xr-environment
    auto-rotate
    rotation-per-second="30deg"
    camera-orbit="0deg 75deg 105%"
    camera-target="0m 0m 0m"
    interaction-prompt="none"
    ar-placement="floor"
    quick-look-browsers="safari chrome"
  >
    <button class="ar-button" slot="ar-button">
      Ver em AR
    </button>
  </model-viewer>

  <!-- Menu flutuante estilizado -->
  <div id="floatingMenu" class="floating-menu">
    <img src="color-icon.png" alt="Colors" id="btnColors">
    <img src="icon.png" alt="Behavior" id="btnBehavior">
    <img src="set-icon.png" alt="Set" id="btnSet">
  </div>

  <!-- Submenus -->
  <div id="colorsMenu" class="submenu">
    <img id="varianteDefault" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-08.png" alt="Blue" data-color="blue">
    <img id="varianteBlue" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-07.png" alt="Yellow" data-color="yellow">
    <img id="varianteOrange" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-11.png" alt="Green" data-color="green">
    <img id="varianteRed" src="https://raw.githubusercontent.com/devcodar/productconfigurator.github.io/gh-pages/CORES-10.png" alt="Red" data-color="red">
  </div>

  <div id="behaviorMenu" class="submenu">
    <img id="btnOpenFrontDoor" src="icon-door.png" alt="door" data-function="rotate">
    <img id="btnOpenBackDoor" src="icon-hood.png" alt="Hood" data-function="hood">
    <img id="btnOpenHood" src="car-trunk-icon.png" alt="Trunk" data-function="trunk">
    <a href="https://devcodar.github.io/productconfigurator.github.io/"><img src="interno.png" alt="Trunk"></a>
  </div>

  <div id="setMenu" class="submenu">
    <img src="icon-skybox.png" alt="Skybox" data-function="skybox" data-env="industrial_workshop_1k">
    <img src="icon-skybox.png" alt="Skybox" data-function="skybox" data-env="parking_1k">
    <img src="icon-skybox.png" alt="Skybox" data-function="skybox" data-env="studio_small_03_1k">
    <img src="icon-ar.png" alt="AR" data-function="ar">
    <img id="botaoRotacao" src="icon-rotate.png" alt="360" data-function="360">
  </div>

  <effect-composer id="customComposer" render-mode="performance">
    <smaa-effect quality="high" blend-mode="DEFAULT" opacity="1"></smaa-effect>
    <color-grade-effect brightness="0.0" contrast="0.2" saturation="0.2" smoothing="0.3" tonemapping="optimized_cineon" blend-mode="DEFAULT" opacity="1" hue="0.0, 2 * PI"></color-grade-effect>
    <selective-bloom-effect strength="0.0" radius="0.8" threshold="1.0" smoothing="0.025"></selective-bloom-effect>
    <ssao-effect></ssao-effect>
  </effect-composer>
  
  <script src="rotacao.js"></script>
  <script src="script.js"></script>
  <script src="img.js"></script>
  <script src="/modelo_moto/telacar.js"></script>
  <script src="carvariantes.js"></script>
  <script src="hostpost.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const modelo2D = document.getElementById('modelo2D');
      const btnColors = document.getElementById('btnColors');
      const btnBehavior = document.getElementById('btnBehavior');
      const btnSet = document.getElementById('btnSet');
      const colorsMenu = document.getElementById('colorsMenu');
      const behaviorMenu = document.getElementById('behaviorMenu');
      const setMenu = document.getElementById('setMenu');
      const loadingOverlay = document.getElementById('loading-overlay');
      const botaoRotacao = document.getElementById('botaoRotacao');

      // Esconder loading quando o modelo carregar
      modelo2D.addEventListener('load', () => {
        loadingOverlay.style.display = 'none';
      });

      // Mostrar loading se demorar
      setTimeout(() => {
        if (loadingOverlay.style.display !== 'none') {
          loadingOverlay.innerHTML = '<div>Carregando... Verifique sua conexão</div>';
        }
      }, 5000);

      // Menu interactions
      btnColors.addEventListener('click', function() {
        colorsMenu.classList.toggle('active');
        behaviorMenu.classList.remove('active');
        setMenu.classList.remove('active');
      });

      btnBehavior.addEventListener('click', function() {
        behaviorMenu.classList.toggle('active');
        colorsMenu.classList.remove('active');
        setMenu.classList.remove('active');
      });

      btnSet.addEventListener('click', function() {
        setMenu.classList.toggle('active');
        colorsMenu.classList.remove('active');
        behaviorMenu.classList.remove('active');
      });

      // Funções para os submenus
      colorsMenu.addEventListener('click', function(e) {
        const color = e.target.getAttribute('data-color');
        if (color) {
          console.log('Alterando cor para:', color);
          // Implementação original mantida
        }
      });

      behaviorMenu.addEventListener('click', function(e) {
        const func = e.target.getAttribute('data-function');
        if (func === 'rotate') {
          console.log('Rotacionando modelo');
        } else if (func === 'hood') {
          console.log('Abrindo capô');
        } else if (func === 'trunk') {
          console.log('Abrindo porta-malas');
        }
      });

      setMenu.addEventListener('click', function(e) {
        const func = e.target.getAttribute('data-function');
        const env = e.target.getAttribute('data-env');
        
        if (env) {
          // Novo sistema de ambientes HDRI
          const envFile = `${env}.hdr`;
          modelo2D.setAttribute('skybox-image', envFile);
          modelo2D.setAttribute('environment-image', envFile);
          
          // Ajustes específicos por ambiente
          if (env === 'industrial_workshop_1k') {
            modelo2D.setAttribute('shadow-intensity', '1.5');
            modelo2D.setAttribute('exposure', '1.2');
          } else if (env === 'parking_1k') {
            modelo2D.setAttribute('shadow-intensity', '1.2');
            modelo2D.setAttribute('exposure', '1.0');
          } else {
            modelo2D.setAttribute('shadow-intensity', '1.0');
            modelo2D.setAttribute('exposure', '0.9');
          }
        } 
        else if (func === 'ar') {
          // AR com configuração melhorada
          modelo2D.activateAR();
          modelo2D.setAttribute('ar-scale', 'fixed');
          modelo2D.setAttribute('ar-placement', 'floor');
        } 
        else if (func === '360') {
          // Rotação 360 melhorada
          const isRotating = modelo2D.hasAttribute('auto-rotate');
          if (isRotating) {
            modelo2D.removeAttribute('auto-rotate');
            botaoRotacao.style.opacity = '0.6';
          } else {
            modelo2D.setAttribute('auto-rotate', '');
            botaoRotacao.style.opacity = '1';
          }
        }
      });

      // Variantes do modelo (código original mantido)
      const variantes = {
        varianteDefault: 'Default',
        varianteOrange: 'BLUE',
        varianteRed: 'ORANGE',
        varianteBlue:'RED',
      };

      Object.keys(variantes).forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.addEventListener('click', function() {
            const varianteNome = variantes[id];
            modelo2D.variantName = varianteNome;
          });
        }
      });

      // Controles de animação (código original mantido)
      const btnOpenFrontDoor = document.getElementById('btnOpenFrontDoor');
      const btnOpenBackDoor = document.getElementById('btnOpenBackDoor');
      const btnOpenHood = document.getElementById('btnOpenHood');
      let hoodOpen = false;
      let frontDoorOpen = false;
      let backDoorOpen = false;
    
      btnOpenFrontDoor.addEventListener('click', () => {
        frontDoorOpen = !frontDoorOpen;
        modelo2D.animationName = 'Object_126Action.001';
        modelo2D.play();
        setTimeout(() => modelo2D.pause(), frontDoorOpen ? 1500 : 0);
      });
    
      btnOpenBackDoor.addEventListener('click', () => {
        backDoorOpen = !backDoorOpen;
        modelo2D.animationName = 'Object_93Action.001';
        modelo2D.play();
        setTimeout(() => modelo2D.pause(), backDoorOpen ? 1500 : 0);
      });
    
      btnOpenHood.addEventListener('click', () => {
        hoodOpen = !hoodOpen;
        modelo2D.animationName = 'Object_91Action.001';
        modelo2D.play();
        setTimeout(() => modelo2D.pause(), hoodOpen ? 1500 : 0);
      });

      // AR Event Listeners
      modelo2D.addEventListener('ar-status', (event) => {
        if (event.detail.status === 'session-started') {
          // Mantém o menu visível durante AR
          document.getElementById('floatingMenu').style.display = 'flex';
        }
      });
    });
  </script>
</body>
</html>
