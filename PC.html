<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D Car Configurator with EXR Environment</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial;
            z-index: 1000;
        }
        .ar-button {
            background-color: white;
            border-radius: 4px;
            border: none;
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="loading">Loading 3D environment...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const canvas = document.getElementById("renderCanvas");
            const loadingOverlay = document.getElementById("loading");
            
            // Initialize Babylon.js engine
            const engine = new BABYLON.Engine(canvas, true);
            
            // Create scene
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
            
            // Load EXR environment
            const envTexture = new BABYLON.CubeTexture.CreateFromPrefilteredData(
                "goega_4k.exr", 
                scene
            );
            scene.environmentTexture = envTexture;
            
            // Create skybox
            const skybox = scene.createDefaultSkybox(envTexture, true, 1000);
            skybox.renderingGroupId = 0;
            
            // Create ground plane
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {
                width: 100,
                height: 100
            }, scene);
            ground.receiveShadows = true;
            
            // Ground material
            const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
            groundMat.albedoColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            groundMat.roughness = 0.8;
            groundMat.metallic = 0.2;
            ground.material = groundMat;
            
            // Lighting setup
            const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light1.intensity = 0.3;
            
            const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            light2.intensity = 0.8;
            light2.shadowEnabled = true;
            
            // Shadow generator
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, light2);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            
            // Load GLB model
            try {
                const result = await BABYLON.SceneLoader.ImportMeshAsync(
                    "",
                    "",
                    "RAPTOR.glb", // Replace with your GLB path
                    scene,
                    null,
                    ".glb"
                );
                
                const carModel = result.meshes[0];
                carModel.scaling = new BABYLON.Vector3(1, 1, 1);
                carModel.position.y = 0.5;
                
                // Enable shadows for all meshes
                result.meshes.forEach(mesh => {
                    shadowGenerator.addShadowCaster(mesh);
                });
                
                // Center camera
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 10, carModel, scene);
                camera.attachControl(canvas, true);
                camera.lowerRadiusLimit = 3;
                camera.upperRadiusLimit = 20;
                
                // Setup AR
                const xr = await scene.createDefaultXRExperienceAsync({
                    floorMeshes: [ground],
                    disableDefaultUI: true
                });
                
                // AR button
                const arButton = document.createElement("button");
                arButton.className = "ar-button";
                arButton.textContent = "VIEW IN AR";
                document.body.appendChild(arButton);
                
                arButton.addEventListener("click", async () => {
                    try {
                        await xr.baseExperience.enterXRAsync("immersive-ar", "local-floor");
                        carModel.scaling = new BABYLON.Vector3(1, 1, 1);
                    } catch (error) {
                        console.error("AR error:", error);
                    }
                });
                
                loadingOverlay.style.display = "none";
                
            } catch (error) {
                console.error("Error loading model:", error);
                loadingOverlay.innerHTML = "Error loading model. Check console for details.";
            }
            
            // Render loop
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            window.addEventListener("resize", () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
