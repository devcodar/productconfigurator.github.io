<!DOCTYPE html>
<html lang="en">
<head>
    <title>Advanced Car Configurator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial;
            z-index: 1000;
        }
        .ar-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            z-index: 999;
            backdrop-filter: blur(5px);
        }
        .inspector-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 5px;
            background: rgba(0,0,0,0.3);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            z-index: 999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="loading">Initializing 3D environment...</div>
    <canvas id="renderCanvas"></canvas>
    <button class="ar-button" id="arButton">VIEW IN AR</button>
    <button class="inspector-button" id="inspectorButton">DEBUG</button>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const canvas = document.getElementById("renderCanvas");
            const loadingOverlay = document.getElementById("loading");
            const arButton = document.getElementById("arButton");
            const inspectorButton = document.getElementById("inspectorButton");
            
            // Initialize engine
            const engine = new BABYLON.Engine(canvas, true);
            
            // Create scene
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
            
            // Load EXR environment
            const envTexture = new BABYLON.CubeTexture.CreateFromPrefilteredData(
                "goega_4k.exr", 
                scene
            );
            scene.environmentTexture = envTexture;
            scene.createDefaultSkybox(envTexture, true, 1000);
            
            // Create invisible ground for AR (won't be visible in normal mode)
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {
                width: 100,
                height: 100
            }, scene);
            ground.isVisible = false; // Hidden in normal view
            ground.receiveShadows = true;
            
            // Lighting setup
            const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light1.intensity = 0.3;
            
            const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            light2.intensity = 0.8;
            light2.shadowEnabled = true;
            
            // Shadow generator
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, light2);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 64;
            
            // Load car model
            let carModel;
            try {
                const result = await BABYLON.SceneLoader.ImportMeshAsync(
                    "",
                    "",
                    "RAPTOR.glb", // Replace with your model path
                    scene
                );
                
                carModel = result.meshes[0];
                
                // Calculate proper ground projection
                const boundingInfo = carModel.getHierarchyBoundingVectors();
                const carHeight = boundingInfo.max.y - boundingInfo.min.y;
                
                // Position car exactly on ground
                carModel.position.y = -boundingInfo.min.y;
                carModel.scaling = new BABYLON.Vector3(1, 1, 1);
                
                // Enable shadows for all meshes
                result.meshes.forEach(mesh => {
                    shadowGenerator.addShadowCaster(mesh);
                    mesh.receiveShadows = true;
                });
                
                // Camera setup
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/3, carHeight * 2, carModel, scene);
                camera.attachControl(canvas, true);
                camera.lowerRadiusLimit = carHeight * 0.8;
                camera.upperRadiusLimit = carHeight * 5;
                camera.wheelPrecision = 30;
                
                loadingOverlay.style.display = "none";
                
            } catch (error) {
                console.error("Error loading model:", error);
                loadingOverlay.innerHTML = "Error loading model. Check console.";
                return;
            }
            
            // AR Setup
            let xrHelper;
            arButton.addEventListener("click", async () => {
                try {
                    if (!xrHelper) {
                        xrHelper = await scene.createDefaultXRExperienceAsync({
                            floorMeshes: [ground],
                            disableDefaultUI: true
                        });
                        
                        // AR-specific adjustments
                        xrHelper.baseExperience.onStateChangedObservable.add((state) => {
                            if (state === BABYLON.WebXRState.IN_XR) {
                                // Hide skybox in AR
                                scene.skybox.setEnabled(false);
                                // Scale model to real size
                                carModel.scaling = new BABYLON.Vector3(1, 1, 1);
                            } else {
                                scene.skybox.setEnabled(true);
                            }
                        });
                    }
                    
                    await xrHelper.baseExperience.enterXRAsync("immersive-ar", "local-floor");
                    
                } catch (error) {
                    console.error("AR error:", error);
                    alert("AR not available: " + error.message);
                }
            });
            
            // Inspector toggle
            inspectorButton.addEventListener("click", () => {
                if (scene.debugLayer.isVisible()) {
                    scene.debugLayer.hide();
                } else {
                    scene.debugLayer.show({
                        overlay: true,
                        globalRoot: document.body
                    });
                }
            });
            
            // Render loop
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            window.addEventListener("resize", () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
