<!DOCTYPE html>
<html lang="en">
<head>
  <title>Car Configurator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial;
      z-index: 1000;
    }
    /* Seus estilos de menu aqui (mantidos do original) */
  </style>
</head>
<body>
  <div id="loading">Carregando cena 3D...</div>
  <canvas id="renderCanvas"></canvas>

  <!-- Seus menus flutuantes aqui (mantidos do original) -->

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const canvas = document.getElementById("renderCanvas");
      const loadingOverlay = document.getElementById("loading");
      
      // Inicializa engine Babylon
      const engine = new BABYLON.Engine(canvas, true);
      
      // Cria cena com ambiente realista
      const createScene = async function() {
        const scene = new BABYLON.Scene(engine);
        
        // Ambiente HDRI profissional para carros
        const hdrTexture = new BABYLON.CubeTexture.CreateFromPrefilteredData(
          "https://assets.babylonjs.com/environments/garageEnv.env", 
          scene
        );
        scene.environmentTexture = hdrTexture;
        scene.createDefaultSkybox(hdrTexture, true, 1000);
        
        // Câmera
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 5, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 2;
        camera.upperRadiusLimit = 15;
        camera.wheelPrecision = 50;
        
        // Luzes
        const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0,1,0), scene);
        light1.intensity = 0.5;
        const light2 = new BABYLON.DirectionalLight("light2", new BABYLON.Vector3(0,-0.5,-1), scene);
        light2.intensity = 0.8;
        light2.shadowEnabled = true;
        
        // Carrega o modelo - SUBSTITUA PELA SUA URL
        await BABYLON.SceneLoader.ImportMeshAsync(
          "", 
          "https://raw.githubusercontent.com/seu-usuario/seu-repo/main/", 
          "RAPTOR.glb", 
          scene,
          undefined,
          ".glb"
        ).then(result => {
          const carModel = result.meshes[0];
          carModel.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);
          
          // Ajusta câmera
          camera.setTarget(carModel);
          const radius = carModel.getBoundingInfo().boundingSphere.radiusWorld;
          camera.radius = radius * 3;
          
          loadingOverlay.style.display = "none";
          
          // Configura AR
          setupAR(scene, carModel);
        }).catch(err => {
          console.error("Erro ao carregar modelo:", err);
          loadingOverlay.innerHTML = "Erro ao carregar o modelo. Verifique o console.";
        });
        
        return scene;
      };
      
      // Configuração AR
      const setupAR = async (scene, model) => {
        const xr = await scene.createDefaultXRExperienceAsync({
          floorMeshes: [model],
          disableDefaultUI: true
        });
        
        // Botão AR
        const arButton = document.createElement("button");
        arButton.innerHTML = "VER EM AR";
        arButton.style.position = "absolute";
        arButton.style.top = "20px";
        arButton.style.right = "20px";
        arButton.style.padding = "10px 15px";
        arButton.style.background = "white";
        arButton.style.border = "none";
        arButton.style.borderRadius = "5px";
        arButton.style.cursor = "pointer";
        arButton.style.zIndex = "100";
        document.body.appendChild(arButton);
        
        arButton.onclick = () => {
          xr.baseExperience.enterXRAsync("immersive-ar", "local-floor", {
            ignoreNativeCameraConstraints: true,
            disableWorldTracking: false
          }).then(() => {
            // Ajustes específicos para AR
            model.scaling = new BABYLON.Vector3(1, 1, 1);
            model.position = BABYLON.Vector3.Zero();
          });
        };
      };
      
      const scene = await createScene();
      
      // Render loop
      engine.runRenderLoop(() => {
        scene.render();
      });
      
      window.addEventListener("resize", () => {
        engine.resize();
      });
      
      // Seus listeners de menu aqui (mantidos do original)
    });
  </script>
</body>
</html>
